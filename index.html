---
layout: homepage
---

<div id="content-area">
  <div id="posts-view">
    <div id="posts-container"></div>
    <div id="pagination" style="text-align: center; margin: 40px 0"></div>
  </div>
</div>

<script>
  // ========== POSTS ARE HERE ==========
  const allPosts = [
    {% for post in site.posts %}
    {
      title: "{{ post.title | escape }}",
      date: "{{ post.date | date: '%d.%m.%Y' }}",
      tags: [{% for tag in post.tags %}"{{ tag }}"{% unless forloop.last %},{% endunless %}{% endfor %}],
      status: {{ post.status | jsonify }},
      content: {{ post.content | jsonify }},
      excerpt: `{{ post.excerpt | strip_html | escape | truncate: 280 }}`
    },
    {% endfor %}
  ];

  const postsPerPage = 5;
  let currentPage = 1;
  let currentTag = 'all';

  function showPosts() {
    const contentArea = document.getElementById('content-area');
    let postsView = document.getElementById('posts-view');

    if (!postsView) {
      postsView = document.createElement('div');
      postsView.id = 'posts-view';
      postsView.innerHTML = `
        <div id="posts-container"></div>
        <div id="pagination" style="text-align: center; margin: 40px 0;"></div>
      `;
    }

    contentArea.replaceChildren(postsView);
  }

  function showAbout() {
    const contentArea = document.getElementById('content-area');

    fetch('/about.html')
      .then(response => response.text())
      .then(html => {
        const temp = document.createElement('div');
        temp.innerHTML = html;
        const aboutPage = temp.querySelector('.about-page');
        const styles = Array.from(temp.querySelectorAll('style')).map(style => style.outerHTML).join('');
        const section = temp.querySelector('section');

        if (aboutPage) {
          contentArea.innerHTML = aboutPage.outerHTML + styles;
        } else if (section) {
          contentArea.innerHTML = section.innerHTML;
        } else {
          contentArea.innerHTML = temp.innerHTML;
        }
        window.revealPageContent?.();
      })
      .catch(() => {
        contentArea.innerHTML = '<h2>Unable to load About</h2>';
        window.revealPageContent?.();
      });
  }

  function renderCurrentPosts() {
    showPosts();
    const filtered = currentTag === 'all'
      ? allPosts
      : allPosts.filter(p => p.tags.includes(currentTag));

    renderPosts(filtered, currentPage);
  }

  function renderStatusIcon(status) {
    const icons = {
      wip: ['fas fa-hourglass-half', 'Work in progress'],
      done: ['fas fa-circle-check', 'Done'],
      draft: ['fas fa-pen-to-square', 'Draft']
    };
    const statusKey = (status || '').toLowerCase();
    if (!icons[statusKey]) return '';

    const [iconClass, label] = icons[statusKey];
    return `<span class="post-status post-status-${statusKey}" role="img" aria-label="${label}" title="${label}"><i class="${iconClass}"></i></span>`;
  }

  function renderPostLinks(content) {
    const temp = document.createElement('div');
    temp.innerHTML = content || '';

    return Array.from(temp.querySelectorAll('a[href]'))
      .map(link => {
        const label = link.textContent.trim();
        const href = link.getAttribute('href');
        if (!label || !href) return '';

        return `<a href="${href}" class="post-link" target="_blank" rel="noopener">${label}</a>`;
      })
      .filter(Boolean)
      .join('');
  }

  function renderPosts(filteredPosts, page) {
    const container = document.getElementById('posts-container');
    container.innerHTML = '';

    const start = (page-1) * postsPerPage;
    const end = start + postsPerPage;
    const pagePosts = filteredPosts.slice(start, end);

    pagePosts.forEach(post => {
      const div = document.createElement('div');
      div.className = 'post-item';
      const postLinks = renderPostLinks(post.content);

      div.innerHTML = `
        <h2 class="post-title">${renderStatusIcon(post.status)}${post.title}</h2>
        <small>${post.date} &nbsp; ${post.tags.map(t => `<button type="button" class="tag post-tag ${currentTag === t ? 'active' : ''}" data-tag="${t}" aria-pressed="${currentTag === t}">#${t}</button>`).join(' ')}</small>
        <p>${post.excerpt}</p>
        ${postLinks ? `<div class="post-links">${postLinks}</div>` : ''}
      `;
      container.appendChild(div);
    });

    renderPagination(filteredPosts.length, page);
  }

  function renderPagination(total, current) {
    const totalPages = Math.ceil(total / postsPerPage);
    if (!totalPages) {
      document.getElementById('pagination').innerHTML = '<p class="pagination-empty">No posts yet</p>';
      return;
    }

    let html = `<button type="button" class="pagination-arrow" data-page="${current - 1}" ${current === 1 ? 'disabled' : ''} aria-label="Previous page">‹</button>`;
    for (let i = 1; i <= totalPages; i++) {
      html += `<button type="button" class="page-link ${i === current ? 'active' : ''}" data-page="${i}" ${i === current ? 'aria-current="page"' : ''}>${i}</button>`;
    }
    html += `<button type="button" class="pagination-arrow" data-page="${current + 1}" ${current === totalPages ? 'disabled' : ''} aria-label="Next page">›</button>`;
    document.getElementById('pagination').innerHTML = html;
  }

  // ========== HANDLERS ==========
  document.addEventListener('DOMContentLoaded', () => {
    const requestedTag = new URLSearchParams(window.location.search).get('tag');
    if (requestedTag) {
      currentTag = requestedTag;
    }

    document.querySelectorAll('.about-link').forEach(aboutLink => {
      aboutLink.addEventListener('click', e => {
        e.preventDefault();
        showAbout();
        window.revealPageContent?.();
      });
    });

    const tagCloudToggle = document.querySelector('.tag-cloud-toggle');
    const tagCloudExtra = document.querySelector('.tag-cloud-extra');

    function syncSidebarTagSelection(selectedTag) {
      document.querySelectorAll('.tag-link').forEach(link => {
        link.classList.toggle('active', link.dataset.tag === selectedTag);
      });

      const activeExtraTag = tagCloudExtra?.querySelector(`.tag-link.active`);
      if (activeExtraTag && tagCloudToggle && tagCloudExtra.hidden) {
        tagCloudToggle.setAttribute('aria-expanded', 'true');
        tagCloudExtra.hidden = false;
      }
    }

    if (tagCloudToggle && tagCloudExtra) {
      tagCloudToggle.addEventListener('click', () => {
        const isOpen = tagCloudToggle.getAttribute('aria-expanded') === 'true';
        tagCloudToggle.setAttribute('aria-expanded', String(!isOpen));
        tagCloudExtra.hidden = isOpen;
      });
    }

    // Click by tags
    document.querySelectorAll('.tag-link').forEach(link => {
      link.addEventListener('click', e => {
        e.preventDefault();

        currentTag = link.dataset.tag;
        currentPage = 1;
        syncSidebarTagSelection(currentTag);
        renderCurrentPosts();
        window.revealPageContent?.();
      });
    });
    syncSidebarTagSelection(currentTag);

    // Click by pagination
    document.getElementById('content-area').addEventListener('click', e => {
      const postTag = e.target.closest('.post-tag');
      if (postTag) {
        currentTag = postTag.dataset.tag;
        currentPage = 1;
        syncSidebarTagSelection(currentTag);
        renderCurrentPosts();
        window.revealPageContent?.();
        return;
      }

      const control = e.target.closest('.page-link, .pagination-arrow');
      if (!control || control.disabled) return;

      currentPage = parseInt(control.dataset.page);
      renderCurrentPosts();
      window.revealPageContent?.();
    });

    // Initial render
    renderCurrentPosts();
    if (requestedTag) {
      window.revealPageContent?.();
    }
  });
</script>

<style>
  .post-item {
    margin-bottom: 3rem;
    padding-bottom: 2rem;
    border-bottom: 1px solid #eee;
    color: #000;
    position: relative;
  }
  .post-item::after {
    content: "";
    position: absolute;
    right: 0;
    bottom: 1.5rem;
    width: 24px;
    height: 14px;
    border-right: 1px solid #c00;
    border-bottom: 1px solid #c00;
    border-radius: 0 0 1px 0;
    pointer-events: none;
  }
  .post-item h2 {
    margin: 0 0 8px 0;
    font-size: 1.35rem;
  }
  .post-title {
    align-items: center;
    display: flex;
    gap: 8px;
  }
  .post-status {
    color: #000;
    display: inline-flex;
    font-size: 1rem;
    line-height: 1;
  }
  .post-item a {
    color: #000;
  }
  .post-item small {
    color: #000;
  }
  .post-item p {
    color: #000;
  }
  .tag {
    background: #f0f0f0;
    border: 1px solid transparent;
    cursor: default;
    color: #000;
    font: inherit;
    line-height: 1.5;
    margin: 0;
    padding: 2px 8px;
    border-radius: 12px;
    font-size: 0.9rem;
  }
  .post-tag {
    cursor: pointer;
  }
  .post-tag:hover {
    background: #ececec;
  }
  .tag.active {
    background: #fff;
    border-color: #111;
    color: #111;
  }
  .post-links {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
  }
  .post-link {
    color: #000;
    text-decoration: none;
  }
  .post-link:hover {
    text-decoration: underline;
  }
  #pagination {
    color: #000;
    font-size: 1.08rem;
  }
  .page-link,
  .pagination-arrow {
    margin: 0 4px;
    border: 1px solid transparent;
    background: transparent;
    color: #000;
    cursor: pointer;
    font: inherit;
    line-height: 1;
    min-height: 44px;
    min-width: 44px;
    padding: 10px 12px;
  }
  .page-link.active {
    border-color: #000;
  }
  .pagination-arrow {
    font-size: 1.25rem;
    padding: 8px 12px;
  }
  .pagination-arrow:disabled {
    cursor: default;
    opacity: 0.35;
  }
  .page-link:hover,
  .pagination-arrow:not(:disabled):hover {
    text-decoration: underline;
  }
  .pagination-empty {
    color: #000;
    font-size: 1.08rem;
  }

  .tag-cloud {
    width: 300px;
    margin-top: 25px;
    margin-left: 50%;
    padding-top: 20px;
    border-top: 1px solid #c00;
    transform: translateX(-50%);
  }
  .tag-cloud a {
    display: inline-block;
    margin: 4px 6px 4px 0;
    padding: 5px 12px;
    background: #f4f4f4;
    border: 1px solid transparent;
    border-radius: 9999px;
    text-decoration: none;
    color: #333;
  }
  .tag-cloud a.active {
    background: #fff;
    border-color: #111;
    color: #111;
  }
  .tag-cloud a:hover {
    background: #ececec;
    color: #333;
  }
  .tag-cloud-toggle {
    display: inline-block;
    margin: 4px 6px 4px 0;
    padding: 5px 12px;
    border: 0;
    background: #f4f4f4;
    border-radius: 9999px;
    color: #333;
    cursor: pointer;
    font: inherit;
  }
  .tag-cloud-toggle:hover,
  .tag-cloud-toggle[aria-expanded="true"] {
    background: #ececec;
    color: #111;
  }
  .tag-cloud-extra {
    max-height: 170px;
    overflow-y: auto;
    padding-right: 6px;
  }

  @media (prefers-color-scheme: dark) {
    .post-item {
      border-color: #444;
      color: #dadbdf;
    }
    .post-status,
    .post-item a,
    .post-item small,
    .post-item p,
    #pagination,
    .pagination-empty,
    .page-link,
    .pagination-arrow {
      color: #dadbdf;
    }
    .page-link.active {
      border-color: #dadbdf;
    }
    .tag {
      background: #333;
      color: #ddd;
    }
    .post-tag:hover {
      background: #444;
    }
    .tag.active {
      background: #20212b;
      border-color: #ddd;
      color: #fff;
    }
    .tag-cloud {
      border-color: #c00;
    }
    .tag-cloud a {
      background: #333;
      color: #ddd;
    }
    .tag-cloud-toggle {
      background: #333;
      color: #ddd;
    }
    .tag-cloud a.active {
      background: #20212b;
      border-color: #ddd;
      color: #fff;
    }
    .tag-cloud a:hover,
    .tag-cloud-toggle:hover,
    .tag-cloud-toggle[aria-expanded="true"] {
      background: #444;
    }
  }

  @media print, screen and (max-width: 960px) {
    .post-item::after {
      bottom: 1.5rem;
      height: 14px;
      width: 24px;
    }
    .tag-cloud {
      width: auto;
      margin-left: 0;
      transform: none;
    }
  }
</style>
